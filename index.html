<!DOCTYPE html>
<html lang="fr">
  <head>
    <!--Heyyyy, je suis contente que tu aille voir par ici ! ^^
    cette idée m'est venu dans mon rer, tête dans les nuages, 
    j'ai penser à créer un mini projet un peu Y2K qui comporte une globalité de mes gouts musicaux,
    je l'ai fini ce 23/12 à 04:18 du matin ≧ ﹏ ≦ -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js"></script>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="images_etoiles/etoiles_star_1.png"
    />
    <title>My Playlist ✧</title>
  </head>
  <body>

    <style>   body {
    cursor: url("mouse_star_souris.png"),24 24, pointer;
    }</style>
    <img
      src="images_etoiles/etoiles_star_1.png"
      alt="Étoile"
      class="etoiles_star_1"
      id="star"
    />
    <img
      src="images_etoiles/etoiles_star_2.png"
      alt="Étoile"
      class="etoiles_star_2"
      id="star"
    />
    <img
      src="images_etoiles/etoiles_star_3.png"
      alt="Étoile"
      class="etoiles_star_3"
      id="star"
    />
    <img
      src="images_etoiles/etoiles_star_4.png"
      alt="Étoile"
      class="etoiles_star_4"
      id="star"
    />

    <!--chargéééééé chargéééé-->
    <div class="loader-wrapper" id="loader">
      <div class="loader"></div>
      <div class="loader-text">☻ Ma Playlist ☻</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!--les boutons qui réagisse au click qui fait jouer l'audio-->

    <div class="container">
      <div class="grid">

        <button id="button0" class="button" onclick="playAudio(0)">
          <img class="button-image" src="images_etoiles/Freddie_Dredd.jpeg" id="Freddie_Dredd" />
        </button>

        <button id="button1" class="button" onclick="playAudio(1)">
          <img class="button-image" src="images_etoiles/Lumi_Athena.jpeg" id="Lumi_Athena" />
        </button>

        <button id="button2" class="button" onclick="playAudio(2)">
          <img class="button-image" src="images_etoiles/Big_Poppa.jpeg" id="Big_Poppa" />
        </button>

        <button id="button3" class="button" onclick="playAudio(3)">
          <img class="button-image" src="images_etoiles/Ayasa.jpeg" id="Ayasa" />
        </button>

        <button id="button4" class="button" onclick="playAudio(4)">
          <img class="button-image" src="images_etoiles/Mac_Demarco.jpeg" id="Mac_Demarco" />
        </button>

        <button id="button5" class="button" onclick="playAudio(5)">
          <img class="button-image" src="images_etoiles/Vanille.jpeg" id="Vanille" />
        </button>

      </div>
    </div>
    <!--pour mes grilles en fonds 😭😭-->
    <div class="grid-background"></div>
  </body>
</html>
